name: Weekly watch availability backfill

# Sunday 06:00 UTC. Fills TMDB watch/providers only for films that still have
# no watch_availability snapshot (does not refresh existing rows).

on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      limit:
        description: "Optional max films to fill (empty = all missing)"
        required: false
        default: ""
      dry_run:
        description: "Preview without writing"
        type: boolean
        required: false
        default: false
      visible_only:
        description: "Only catalog_visible films"
        type: boolean
        required: false
        default: true

concurrency:
  group: weekly-watch-availability
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill-watch:
    name: Fill missing TMDB watch snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync missing watch_availability
        env:
          APP_ENV: hosted
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          set -euo pipefail
          ARGS=(--missing-only)

          if [ "${{ github.event.inputs.visible_only }}" != "false" ]; then
            ARGS+=(--visible-only)
          fi

          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi

          LIMIT="${{ github.event.inputs.limit }}"
          if [ -n "${LIMIT}" ]; then
            ARGS+=(--limit="${LIMIT}")
          fi

          echo "Running: npm run sync:watch-availability -- ${ARGS[*]}"
          npm run sync:watch-availability -- "${ARGS[@]}"
